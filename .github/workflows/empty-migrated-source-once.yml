name: Empty source after verified migration
on:
  push:
    branches: [main]
    paths: [.github/workflows/empty-migrated-source-once.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify destination and empty source branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --bare https://github.com/nizanr/woody_bambu.git source.git
          cd source.git
          git remote add destination https://github.com/nizanr/academic-lab-reservation-system.git
          test "$(git ls-remote destination refs/heads/main | cut -f1)" = "023cd75b726ea401ae4b50aab73f51cca56527f2"
          test "$(git ls-remote destination refs/heads/copilot/develop-ar-feature-for-ecommerce | cut -f1)" = "59a7f46c8a415559c4c7d954d11313313bc23be1"
          test "$(git rev-parse refs/heads/main)" = "$EXPECTED_SOURCE"
          git config user.name "Nisa Nur Çakır"
          git config user.email "187197438+nizanr@users.noreply.github.com"
          EMPTY_TREE="$(git mktree </dev/null)"
          MAIN_CLEAN="$(printf '%s\n' 'Remove files after migration to nizanr/academic-lab-reservation-system' | git commit-tree "$EMPTY_TREE" -p "$EXPECTED_SOURCE")"
          OTHER_CLEAN="$(printf '%s\n' 'Remove files after migration to nizanr/academic-lab-reservation-system' | git commit-tree "$EMPTY_TREE" -p 59a7f46c8a415559c4c7d954d11313313bc23be1)"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push --atomic --force-with-lease="refs/heads/main:$EXPECTED_SOURCE" --force-with-lease="refs/heads/copilot/develop-ar-feature-for-ecommerce:59a7f46c8a415559c4c7d954d11313313bc23be1" origin "$MAIN_CLEAN:refs/heads/main" "$OTHER_CLEAN:refs/heads/copilot/develop-ar-feature-for-ecommerce"
